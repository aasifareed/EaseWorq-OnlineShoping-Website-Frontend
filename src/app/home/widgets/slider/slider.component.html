<owl-carousel-o [options]="HomeSliderConfig" class="home-slider" [ngClass]="class">
  <ng-container *ngFor="let slider of sliders; let i = index">
    <ng-template carouselSlide>
      <a class="home-hero-slide-link"
         [routerLink]="slideLink(slider)"
         [queryParams]="slideQueryParams(slider)"
         [attr.href]="isExternalLink(slider) ? externalHref(slider) : null"
         (click)="onSlideClick($event, slider)"
         [attr.aria-label]="'View promotion — ' + (buttonText || 'Shop Now')">
        <div class="home home-hero-slide" [ngClass]="textClass">
          <img
            class="home-hero-slide__img"
            [src]="slider.image"
            [attr.loading]="i === 0 ? 'eager' : 'lazy'"
            [attr.fetchpriority]="i === 0 ? 'high' : 'low'"
            [attr.decoding]="i === 0 ? 'sync' : 'async'"
            alt="Promotional banner" />
          <span class="home-hero-cta" [ngClass]="buttonClass">
            <span class="home-hero-cta__label">{{ buttonText || 'Shop Now' }}</span>
            <span class="home-hero-cta__icon" aria-hidden="true">
              <i class="fa fa-arrow-right"></i>
            </span>
          </span>
        </div>
      </a>
    </ng-template>
  </ng-container>
</owl-carousel-o>
