<div class="sk-boot sk-boot--app" *ngIf="bootstrapping$ | async" aria-live="polite" aria-busy="true">
  <div class="sk-boot__glow" aria-hidden="true"></div>
  <div class="sk-boot__content">
    <div class="sk-boot__mark" aria-hidden="true">
      <span class="sk-boot__mark-cart"></span>
    </div>
    <p class="sk-boot__brand">Sasta <span>Khareedo</span></p>
    <p class="sk-boot__tagline">Smart Shopping. Honest Prices.</p>
    <div class="sk-boot__track" role="progressbar" aria-label="Loading store">
      <span class="sk-boot__bar"></span>
    </div>
    <p class="sk-boot__status">Preparing your store</p>
  </div>
</div>

<app-busy-overlay></app-busy-overlay>

<router-outlet></router-outlet>

<app-tap-to-top></app-tap-to-top>
<app-chat-widget></app-chat-widget>
