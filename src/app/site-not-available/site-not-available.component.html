<section class="site-not-available">
  <div class="site-not-available__layout">
    <div class="site-not-available__visual" aria-hidden="true">
      <img
        class="site-not-available__illustration"
        src="assets/images/not-found-imgs/store-not-found.svg"
        alt=""
        decoding="async"
      />
    </div>

    <div class="site-not-available__content">
      <div class="site-not-available__icon" aria-hidden="true">
        <i class="fa fa-shopping-bag"></i>
        <span class="site-not-available__icon-badge">×</span>
      </div>

      <h1 class="site-not-available__title">Business Not Found</h1>
      <p class="site-not-available__message">
        We could not find an online shop for this address. Please check the URL or contact the store owner.
      </p>

      <div class="site-not-available__help">
        <div class="site-not-available__help-icon" aria-hidden="true">
          <i class="fa fa-headphones"></i>
        </div>
        <div>
          <p class="site-not-available__help-title">Need Help?</p>
          <p class="site-not-available__help-text">
            If you believe this is a mistake, please contact the store owner.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
