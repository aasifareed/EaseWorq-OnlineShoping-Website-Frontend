<section class="home-explore-categories" *ngIf="!loading && categories.length">
  <div class="home-explore-categories__head">
    <h2 class="home-section-title" *ngIf="!gridMode">{{ sectionTitle }}</h2>
    <h3 class="home-section-title" [class.text-center]="gridMode" *ngIf="gridMode">{{ sectionTitle }}</h3>
  </div>

  <div
    class="top-categories-grid"
    [class.top-categories-grid--few]="categories.length <= 4"
    *ngIf="!gridMode && !useCarousel"
    [style.grid-template-columns]="gridTemplateColumns">
    <a
      *ngFor="let category of categories"
      [routerLink]="['/shop']"
      [queryParams]="{ category: category.id }"
      class="top-category-card">
      <div
        class="top-category-img img-frame--category"
        [class.img-frame--category-empty]="isPlaceholderImage(category.image)">
        <img
          *ngIf="!isPlaceholderImage(category.image)"
          [src]="category.image"
          [alt]="displayCategoryName(category.name)"
          loading="lazy"
          decoding="async" />
        <div class="top-category-img__shade"></div>
        <div class="top-category-caption">
          <span class="top-category-caption__name">{{ displayCategoryName(category.name) }}</span>
          <span class="top-category-caption__cta">Explore →</span>
        </div>
      </div>
    </a>
  </div>

  <owl-carousel-o [options]="categorySliderConfig" *ngIf="!gridMode && useCarousel">
    <ng-container *ngFor="let category of categories">
      <ng-template carouselSlide>
        <a
          [routerLink]="['/shop']"
          [queryParams]="{ category: category.id }"
          class="top-category-card">
          <div
            class="top-category-img img-frame--category"
            [class.img-frame--category-empty]="isPlaceholderImage(category.image)">
            <img
              *ngIf="!isPlaceholderImage(category.image)"
              [src]="category.image"
              [alt]="displayCategoryName(category.name)" />
            <div class="top-category-img__shade"></div>
            <div class="top-category-caption">
              <span class="top-category-caption__name">{{ displayCategoryName(category.name) }}</span>
              <span class="top-category-caption__cta">Explore →</span>
            </div>
          </div>
        </a>
      </ng-template>
    </ng-container>
  </owl-carousel-o>

  <div class="row g-3" *ngIf="gridMode">
    <div class="col-6 col-md-4 col-lg-3" *ngFor="let category of categories">
      <a
        [routerLink]="['/shop']"
        [queryParams]="{ category: category.id }"
        class="top-category-card">
        <div
          class="top-category-img img-frame--category"
          [class.img-frame--category-empty]="isPlaceholderImage(category.image)">
          <img
            *ngIf="!isPlaceholderImage(category.image)"
            [src]="category.image"
            [alt]="displayCategoryName(category.name)" />
          <div class="top-category-img__shade"></div>
          <div class="top-category-caption">
            <span class="top-category-caption__name">{{ displayCategoryName(category.name) }}</span>
            <span class="top-category-caption__cta">Explore →</span>
          </div>
        </div>
      </a>
    </div>
  </div>
</section>
