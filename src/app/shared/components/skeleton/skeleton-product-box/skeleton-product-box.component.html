<div>
    <div class="img-wrapper">
      <ngx-skeleton-loader [theme]="{ 'background-color': 'var(--skeleton-base)', 'border-radius': 'var(--radius-sm)', height: '280px' }"></ngx-skeleton-loader>
    </div>
    <div class="product-detail">
      <h4> 
        <ngx-skeleton-loader
          [theme]="{ 'background-color': 'var(--skeleton-base)', width: '130px', 'border-radius': 'var(--radius-sm)',  height: '15px', 'margin-bottom': '6px'}">
        </ngx-skeleton-loader>
      </h4>
      <h5>
        <ngx-skeleton-loader
          [theme]="{ 'background-color': 'var(--skeleton-base)', width: '160px', 'border-radius': 'var(--radius-sm)',  height: '12px'}">
        </ngx-skeleton-loader>
      </h5>
      <h6>
        <ngx-skeleton-loader
          [theme]="{ 'background-color': 'var(--skeleton-base)', width: '70px', 'border-radius': 'var(--radius-sm)',  height: '14px'}">
        </ngx-skeleton-loader>
      </h6>
    </div>
</div>
