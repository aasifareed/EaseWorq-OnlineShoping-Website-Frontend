<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sastakhareedo.com | Online Shopping Store</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Shop online at Sastakhareedo.com — mobiles, accessories, and more at great prices. Fast delivery across Pakistan.">
    <meta property="og:title" content="Sastakhareedo.com | Online Shopping Store">
    <meta property="og:description" content="Shop online at Sastakhareedo.com — mobiles, accessories, and more at great prices.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon-store.svg?v=sasta-khareedo-2">
    <link rel="shortcut icon" type="image/svg+xml" href="assets/images/favicon-store.svg?v=sasta-khareedo-2">
    <link rel="apple-touch-icon" href="assets/images/favicon-store.svg?v=sasta-khareedo-2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GIS) — do not use legacy platform.js / gapi auth2 for new web clients -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="ltr">
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('shop_theme');
          if (theme !== 'light') {
            document.body.classList.add('dark');
          }
        } catch (e) {
          document.body.classList.add('dark');
        }
      })();
    </script>
    <script>
      (function () {
        try {
          if (location.hash && location.hash.indexOf('#/shop/product/') === 0) {
            return;
          }
          var path = (location.pathname || '').replace(/\/+$/, '');
          var match = path.match(/^\/shop\/product\/(?:left\/sidebar\/)?([^/]+)$/i);
          if (!match || !match[1]) {
            return;
          }
          location.replace('/#/shop/product/' + encodeURIComponent(match[1]) + (location.search || ''));
        } catch (e) {}
      })();
    </script>

    <div id="storefront-bootstrap-loader" class="sk-boot" aria-live="polite" aria-busy="true">
      <div class="sk-boot__glow" aria-hidden="true"></div>
      <div class="sk-boot__content">
        <img class="sk-boot__logo" alt="Sasta Khareedo" hidden />
        <p class="sk-boot__brand">Sasta <span>Khareedo</span></p>
        <p class="sk-boot__tagline">Smart Shopping. Honest Prices.</p>
        <div class="sk-boot__track" role="progressbar" aria-label="Loading store">
          <span class="sk-boot__bar"></span>
        </div>
        <p class="sk-boot__status">Preparing your store</p>
      </div>
    </div>

    <style>
      .sk-boot {
        --sk-yellow: #ffc400;
        --sk-ink: #f5f5f5;
        --sk-muted: rgba(255, 255, 255, 0.62);
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 55% at 50% 35%, rgba(255, 196, 0, 0.14), transparent 62%),
          radial-gradient(ellipse 90% 70% at 50% 100%, rgba(255, 196, 0, 0.05), transparent 55%),
          #0a0a0a;
        color: var(--sk-ink);
        font-family: Outfit, Lato, sans-serif;
        animation: sk-boot-fade-in 0.45s ease-out both;
      }

      .sk-boot__glow {
        position: absolute;
        width: 42vmin;
        height: 42vmin;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 196, 0, 0.22), transparent 68%);
        filter: blur(8px);
        animation: sk-boot-pulse 2.4s ease-in-out infinite;
        pointer-events: none;
      }

      .sk-boot__content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
        max-width: 22rem;
      }

      .sk-boot__logo {
        display: block;
        width: auto;
        max-width: min(240px, 72vw);
        height: auto;
        max-height: 72px;
        margin-bottom: 1.15rem;
        object-fit: contain;
        filter: brightness(0) invert(1);
        animation: sk-boot-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .sk-boot__brand {
        margin: 0 0 0.4rem;
        font-size: clamp(1.55rem, 4.5vw, 2rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: #fff;
        animation: sk-boot-rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
      }

      .sk-boot__brand span {
        color: var(--sk-yellow);
      }

      .sk-boot__tagline {
        margin: 0 0 1.5rem;
        font-size: 0.92rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--sk-muted);
        animation: sk-boot-rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both;
      }

      .sk-boot__track {
        width: min(220px, 62vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        margin-bottom: 0.85rem;
        animation: sk-boot-rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      }

      .sk-boot__bar {
        display: block;
        height: 100%;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--sk-yellow), #ffe27a, var(--sk-yellow), transparent);
        animation: sk-boot-slide 1.35s ease-in-out infinite;
      }

      .sk-boot__status {
        margin: 0;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 196, 0, 0.85);
        animation: sk-boot-rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.26s both;
      }

      @keyframes sk-boot-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes sk-boot-rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes sk-boot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.12); opacity: 1; }
      }

      @keyframes sk-boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .sk-boot,
        .sk-boot__glow,
        .sk-boot__logo,
        .sk-boot__brand,
        .sk-boot__tagline,
        .sk-boot__track,
        .sk-boot__status,
        .sk-boot__bar {
          animation: none !important;
        }
        .sk-boot__bar {
          width: 55%;
          transform: none;
          margin-inline: auto;
        }
      }
    </style>

    <app-root></app-root>
    <script>
      (function () {
        function readCachedStoreLogoUrl() {
          try {
            for (var index = 0; index < localStorage.length; index += 1) {
              var key = localStorage.key(index);
              if (!key || key.indexOf('ew_online_shop_logo_') !== 0) {
                continue;
              }
              var parsed = JSON.parse(localStorage.getItem(key) || 'null');
              var logoUrl = parsed && parsed.logoUrl ? String(parsed.logoUrl).trim() : '';
              if (logoUrl) {
                return logoUrl;
              }
            }
          } catch (e) {}
          return '';
        }

        function applyBootLogo() {
          var root = document.getElementById('storefront-bootstrap-loader');
          if (!root) {
            return;
          }

          var logoUrl = readCachedStoreLogoUrl();
          var img = root.querySelector('.sk-boot__logo');
          var brand = root.querySelector('.sk-boot__brand');
          if (!img || !logoUrl) {
            return;
          }

          img.addEventListener('error', function () {
            img.hidden = true;
            if (brand) {
              brand.style.display = '';
            }
          });

          img.src = logoUrl;
          img.hidden = false;
          if (brand) {
            brand.style.display = 'none';
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', applyBootLogo, { once: true });
        } else {
          applyBootLogo();
        }
      })();
    </script>
    <script>
      (function () {
        function loadBootstrapJs() {
          if (document.getElementById('bootstrap-bundle-js')) {
            return;
          }
          var js = document.createElement('script');
          js.id = 'bootstrap-bundle-js';
          js.async = true;
          js.defer = true;
          js.src = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js';
          js.integrity = 'sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI';
          js.crossOrigin = 'anonymous';
          document.body.appendChild(js);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadBootstrapJs, { once: true });
        } else {
          loadBootstrapJs();
        }
      })();
    </script>
</body>

</html>
