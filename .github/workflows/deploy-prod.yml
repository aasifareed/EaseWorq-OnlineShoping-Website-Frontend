name: Deploy Online Shop Storefront to PROD

on:
  push:
    branches:
      - PROD
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment: PROD

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Node 22 LTS — package-lock.json is gitignored in this repo, so npm cache is disabled
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular (production)
        shell: pwsh
        run: |
          npx ng build --configuration production
          if (-not (Test-Path "dist\multikart\browser\index.html")) {
            throw "Build output missing: dist/multikart/browser/index.html"
          }

      - name: Ensure web.config is in dist
        shell: pwsh
        run: |
          $dist = "dist\multikart\browser"
          if (-not (Test-Path "$dist\web.config") -and (Test-Path "src\web.config")) {
            Copy-Item "src\web.config" "$dist\web.config" -Force
            Write-Host "Copied src/web.config into $dist/"
          }
          if (-not (Test-Path "$dist\web.config")) {
            throw "dist/multikart/browser/web.config is missing — IIS pretty URLs will break"
          }

      - name: Deploy to IIS via SFTP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hostname = "${{ secrets.IIS_SERVER }}"
          $port = if ("${{ secrets.IIS_PORT }}") { "${{ secrets.IIS_PORT }}" } else { "22" }
          $username = "${{ secrets.IIS_USERNAME }}"
          $password = "${{ secrets.IIS_PASSWORD }}"
          $remotePath = "${{ secrets.PROD_IIS_DEPLOY_DIR }}"
          $siteName = "${{ secrets.PROD_IIS_SITE_NAME }}"
          $localPath = "./dist/multikart/browser"

          if (-not $hostname -or -not $username -or -not $password -or -not $remotePath) {
            throw "Missing required secrets: IIS_SERVER, IIS_USERNAME, IIS_PASSWORD, PROD_IIS_DEPLOY_DIR"
          }

          Write-Host "Deploying storefront PROD"
          Write-Host "IIS site: $siteName"
          Write-Host "Remote path: $remotePath"

          Install-Module -Name Posh-SSH -Force -Scope CurrentUser -AllowClobber
          Import-Module Posh-SSH

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($username, $securePassword)

          $sshSession = New-SSHSession -ComputerName $hostname -Port $port -Credential $credential -AcceptKey
          Invoke-SSHCommand -SessionId $sshSession.SessionId -Command "mkdir -p `"$remotePath`"" | Out-Null

          $sftpSession = New-SFTPSession -ComputerName $hostname -Port $port -Credential $credential -AcceptKey

          function Upload-Directory {
            param($SftpSession, $SshSessionId, $LocalDir, $RemoteDir)

            $items = Get-ChildItem -Path $LocalDir -Recurse -File
            $root = (Resolve-Path $LocalDir).Path

            foreach ($item in $items) {
              $relativePath = $item.FullName.Substring($root.Length + 1)
              $remoteFilePath = ($RemoteDir + "/" + $relativePath) -replace '\\', '/' -replace '//', '/'

              $remoteFileDir = $remoteFilePath.Substring(0, $remoteFilePath.LastIndexOf('/'))
              if ($remoteFileDir -and $remoteFileDir -ne $RemoteDir) {
                Invoke-SSHCommand -SessionId $SshSessionId -Command "mkdir -p `"$remoteFileDir`"" | Out-Null
              }

              Write-Host "Uploading: $relativePath"
              # Same pattern as EaseWorqWebsite / POS-Admin-Frontend.
              # OpenWrite does not truncate; SetLength cuts leftover bytes from a
              # shorter upload (this previously left old Facebook script after </html>).
              $fileContent = [System.IO.File]::ReadAllBytes($item.FullName)
              $stream = $SftpSession.Session.OpenWrite($remoteFilePath)
              $stream.Write($fileContent, 0, $fileContent.Length)
              if ($stream.CanSeek) {
                $stream.SetLength($fileContent.Length)
              }
              $stream.Flush()
              $stream.Close()
              $stream.Dispose()
            }
          }

          Upload-Directory -SftpSession $sftpSession -SshSessionId $sshSession.SessionId -LocalDir $localPath -RemoteDir $remotePath

          Remove-SFTPSession -SessionId $sftpSession.SessionId | Out-Null
          Remove-SSHSession -SessionId $sshSession.SessionId | Out-Null
          Write-Host "PROD storefront deploy completed."
